name = "jev-stg"
main = "./src/ssr.tsx"
# Pinned to the newest date the installed workerd supports, not to today's date:
# a date beyond that ceiling makes the local runtime refuse to start, so
# `vite dev` breaks for everyone. Raise it only together with wrangler.
compatibility_date = "2026-07-15"
compatibility_flags = ["nodejs_compat"]

# Workers Logs: invocation records, console.*, uncaught exceptions.
[observability]
enabled = true

# A consultation spends the AI Gateway key and takes no session, so each caller
# is bounded by address. A world asks once a month of game time, which at the
# fastest speed is about 25 times a minute, so the ceiling only meets scripts.
[[ratelimits]]
name = "JEV_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 30
period = 60

# Declared so `wrangler types` emits these on CloudflareEnv deterministically.
# Without this block the generator falls back to whatever local env file it
# finds, so the type differs between a developer machine and CI. Values are
# never here; they are registered with `wrangler secret put`.
#
# Naming a secret here also makes it required at deploy time, so register it with
# `wrangler secret put` before deploying (see docs/DEPLOYMENT.md).
[secrets]
required = ["AI_GATEWAY_API_KEY"]
